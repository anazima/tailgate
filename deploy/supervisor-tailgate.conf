; Install to /etc/supervisor/conf.d/tailgate.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update
[program:tailgate]
command=/www/wwwroot/tailgate/venv/bin/gunicorn config.wsgi:application -c /www/wwwroot/tailgate/deploy/gunicorn.conf.py
directory=/www/wwwroot/tailgate
user=www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/www/wwwroot/tailgate/logs/supervisor.log
stderr_logfile=/www/wwwroot/tailgate/logs/supervisor_err.log
