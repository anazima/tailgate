# tailgate.retoph.com — Django dashboard (gunicorn :8100)
#
# Install to /www/server/panel/vhost/rewrite/tailgate.retoph.com.conf. aaPanel
# includes this file inside the server{} block of its own vhost and never
# rewrites it, so all custom configuration lives here.
#
# `^~` on the prefix locations: the panel vhost declares regex locations for
# \.(js|css)$ and image extensions, and a regex location beats a plain prefix.
# Without `^~`, /static/news/app.js and /media/stories/1.jpg would be served
# from the (empty) panel docroot instead of from disk here.

if ($scheme = http) {
    return 301 https://$host$request_uri;
}

location ^~ /static/ {
    alias /www/wwwroot/tailgate/staticfiles/;
    expires 7d;
    access_log off;
}

location ^~ /media/ {
    alias /www/wwwroot/tailgate/media/;
    expires 1d;
    access_log off;
}

# Exact match beats the vhost's \.js regex; the service worker must come from
# Django at the site root so its scope covers the whole dashboard.
location = /sw.js {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Strict-Transport-Security;
    add_header Cache-Control "no-cache";
}

location / {
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Set, never passed through: Django trusts this header (SECURE_PROXY_SSL_HEADER).
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_redirect off;
    client_max_body_size 5m;
    proxy_read_timeout 60s;
    # nginx already adds HSTS for the whole server.
    proxy_hide_header Strict-Transport-Security;
}
