<!doctype html>
{% load static %}
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Texas News Curator</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'news/favicon-32.png' %}">
<link rel="shortcut icon" href="{% static 'news/favicon.ico' %}">
<link rel="apple-touch-icon" href="{% static 'news/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'news/manifest.json' %}">
<meta name="theme-color" content="#1c1917">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center">
<form method="post" class="bg-white border border-stone-200 rounded-lg p-6 w-80 flex flex-col gap-3">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <h1 class="font-semibold text-lg">Texas News Curator</h1>
  {% if error %}<p class="text-sm text-red-700">{{ error }}</p>{% endif %}
  <input type="text" name="username" placeholder="Username" autofocus autocomplete="username" class="border rounded px-3 py-2">
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" class="border rounded px-3 py-2">
  <button class="bg-stone-900 text-white rounded px-3 py-2">Log in</button>
</form>
</body></html>
