<!doctype html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Texas News Curator{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <link rel="stylesheet" href="{% static 'news/app.css' %}">
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="bg-stone-900 text-stone-100 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 h-12 flex items-center gap-3 text-sm">
      <span id="pipeline-status" class="truncate">{% include "news/_pipeline_status.html" %}</span>
      <div class="ml-auto flex items-center gap-2">
        <form hx-post="{% url 'news:run_now' %}" hx-target="#pipeline-status" hx-swap="innerHTML">
          {% csrf_token %}
          <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-stone-900 font-medium px-3 py-1 rounded"
                  {% if run_in_progress %}disabled{% endif %}>Run now</button>
        </form>
        <div class="relative">
          <button id="menu-btn" type="button" aria-label="Menu" aria-expanded="false"
                  class="w-9 h-9 rounded-full bg-stone-700 hover:bg-stone-600 flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <nav id="menu"
               class="hidden absolute right-0 top-11 w-48 bg-white text-stone-900 rounded-lg shadow-lg border border-stone-200 py-1 flex flex-col">
            <a href="{% url 'news:dashboard' %}" class="px-4 py-2 hover:bg-stone-100">Dashboard</a>
            <a href="{% url 'news:hidden' %}" class="px-4 py-2 hover:bg-stone-100">Hidden</a>
            <a href="/admin/news/source/" class="px-4 py-2 hover:bg-stone-100">Sources</a>
            <a href="/admin/" class="px-4 py-2 hover:bg-stone-100">Admin</a>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'news:logout' %}" class="border-t border-stone-200 mt-1">{% csrf_token %}
              <button class="w-full text-left px-4 py-2 hover:bg-stone-100 text-stone-500">Log out ({{ user.username }})</button></form>
            {% endif %}
          </nav>
        </div>
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-6">{% block content %}{% endblock %}</main>

  <dialog id="lightbox" class="p-0 bg-transparent max-w-[95vw] max-h-[95vh] backdrop:bg-black/80">
    <img id="lightbox-img" src="" alt="" class="max-w-[95vw] max-h-[95vh] object-contain cursor-zoom-out">
  </dialog>
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-sm px-4 py-2 rounded shadow hidden"></div>
  <script src="{% static 'news/app.js' %}" defer></script>
</body>
</html>
